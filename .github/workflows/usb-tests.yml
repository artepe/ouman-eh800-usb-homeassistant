name: USB protocol regression tests
on:
  push:
    branches:
      - feat/usb-async-safe-config-20261010
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Run fake-serial unit tests
        run: python -m unittest discover -s tests -v
