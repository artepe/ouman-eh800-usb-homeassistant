name: Protocol library tests

on:
  push:
    paths:
      - 'protocol/**'
      - '.github/workflows/protocol-tests.yml'
  pull_request:
    paths:
      - 'protocol/**'
      - '.github/workflows/protocol-tests.yml'

jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install library and test dependencies
        run: python -m pip install -e 'protocol[test]'
      - name: Test
        run: python -m pytest protocol/tests -q
